[project]
name = "ewidencja3d-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "reportlab>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=0.28",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F",
    "I",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
