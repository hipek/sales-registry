[project]
name = "ewidencja3d-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "pytest-asyncio>=0.24",
]
