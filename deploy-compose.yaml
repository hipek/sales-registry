services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:sqlite:///./data/database.sqlite}
      SELLER_NAME: ${SELLER_NAME:Your Shop Name}
      SELLER_ADDRESS: ${SELLER_ADDRESS:Your Shop Address}
      SELLER_NIP: ${SELLER_NIP:}
      QUARTERLY_LIMIT: ${QUARTERLY_LIMIT:10813.50}
      RECEIPT_PREFIX: ${RECEIPT_PREFIX:R}
      CORS_ORIGINS: ${CORS_ORIGINS:http://localhost:3000}
      BACKEND_HOST: ${BACKEND_HOST:0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:8000}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3003:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      BACKEND_API_URL: ${BACKEND_API_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
