services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8003:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3003:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
