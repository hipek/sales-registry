services:
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./backend:/app
      - ./data:/app/data
    command: ["sh", "-c", "export UV_PROJECT_ENVIRONMENT=.venv-container && uv run uvicorn app.main:app --host 0.0.0.0 --reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_DEV_ALLOW_ALL_ORIGINS=true
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_API_URL=http://backend-dev:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      backend-dev:
        condition: service_healthy
    restart: unless-stopped

  backend-e2e:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/e2e.sqlite
      CORS_ORIGINS: http://frontend-e2e:3000,http://localhost:3000
    volumes:
      - ./backend:/app
      - ./data:/app/data
    command: ["sh", "-c", "export UV_PROJECT_ENVIRONMENT=.venv-container && uv run uvicorn app.main:app --host 0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: "no"

  frontend-e2e:
    build:
      context: .
      dockerfile: Dockerfile.frontend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_DEV_ALLOW_ALL_ORIGINS=true
      - NEXT_PUBLIC_API_URL=http://backend-e2e:8000
      - BACKEND_API_URL=http://backend-e2e:8000
      - NEXT_PUBLIC_APP_URL=http://frontend-e2e:3000
    depends_on:
      backend-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: "no"

  e2e:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    environment:
      - BASE_URL=http://frontend-e2e:3000
      - API_URL=http://backend-e2e:8000
    volumes:
      - ./e2e/tests:/app/tests
      - ./e2e/results:/app/results
      - ./e2e/test-results:/app/test-results
    depends_on:
      backend-e2e:
        condition: service_healthy
      frontend-e2e:
        condition: service_healthy
    restart: "no"
