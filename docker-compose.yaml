services:
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./backend:/app
      - ./data:/app/data
    command: ["sh", "-c", "export UV_PROJECT_ENVIRONMENT=.venv-container && uv run uvicorn app.main:app --host 0.0.0.0 --reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_API_URL=http://backend-dev:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      backend-dev:
        condition: service_healthy
    restart: unless-stopped
